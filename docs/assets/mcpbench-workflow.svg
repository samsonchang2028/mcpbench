<svg viewBox="0 0 720 592" width="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="592" fill="#ffffff"/>

  <!-- Title: content x=25..695, center=360; baseline y=32 (top margin 20) -->
  <text x="360" y="32" font-size="16" text-anchor="middle" fill="#1e293b">MCPBench v1 — Benchmark Workflow</text>

  <!-- ===== LAYER 1: dashed grouping boxes (zones) ===== -->
  <!-- ZONE 1 control plane: x=25 y=48 w=670 h=96, bottom=144 -->
  <rect x="25" y="48" width="670" height="96" rx="10" fill="#f8fafc" stroke="#a855f7" stroke-dasharray="6,4"/>
  <!-- ZONE 2 Compose project: x=25 y=170 w=670 h=215, bottom=385 -->
  <rect x="25" y="170" width="670" height="215" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-dasharray="6,4"/>
  <!-- ZONE 3 host: x=25 y=411 w=670 h=96, bottom=507 -->
  <rect x="25" y="411" width="670" height="96" rx="10" fill="#f8fafc" stroke="#22c55e" stroke-dasharray="6,4"/>

  <!-- ===== LAYER 2: connectors ===== -->
  <!-- 1: launcher -> evaluator (green). down-left, land evaluator top x=210. cp2.x=end.x=210 -->
  <path d="M330,133 C 300,160 210,165 210,185" fill="none" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <!-- 2: launcher -> agent (blue). straight down x=360 -->
  <path d="M360,133 L 360,185" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <!-- 3: agent -> ollama (blue dashed). exit agent LEFT edge, descend left channel x=245. cp2.x=end.x=245 -->
  <path d="M270,265 C 258,276 245,350 245,426" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-blue)"/>
  <!-- 4a: agent -> MCP (orange). rightward. agent right=445, MCP left=475 -->
  <path d="M450,232 L 464,232" fill="none" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <!-- 4b: MCP -> PostgreSQL (pink). down then left into PG right edge x=446. cp2.y=end.y=330 -->
  <path d="M530,273 C 490,296 500,330 446,330" fill="none" stroke="#ec4899" stroke-width="1.4" marker-end="url(#arrow-pink)"/>
  <!-- 5: agent -> artifacts (green). exit agent RIGHT edge, descend right channel x=475. cp2.x=end.x=475 -->
  <path d="M450,265 C 462,276 475,350 475,426" fill="none" stroke="#22c55e" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <!-- 6: evaluator -> PostgreSQL (green dashed). down then right into PG left edge x=274. cp2.y=end.y=333 -->
  <path d="M160,273 C 160,333 250,333 274,333" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>

  <!-- ===== LAYER 3: boxes + text ===== -->
  <!-- zone titles (top-left corner, short so connectors clear them) -->
  <text x="37" y="64" font-size="11" fill="#64748b">Trusted host control plane · no Docker socket</text>
  <text x="37" y="186" font-size="11" fill="#64748b">Compose project mcpbench</text>
  <text x="37" y="425" font-size="11" fill="#64748b">Existing host · never restarted</text>

  <!-- Launcher: x=275 w=170 h=54 (2 lines), y=74 bottom=128, center=360 -->
  <rect x="275" y="74" width="170" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="360" y="96" font-size="12" text-anchor="middle" fill="#6b21a8">Host launcher</text>
  <text x="360" y="114" font-size="10" text-anchor="middle" fill="#6b21a8">sequences phases · deadlines</text>

  <!-- Row of three: evaluator x=75 ; agent x=275 ; MCP x=475 ; all w=170 y=196 h=72 (3 lines) bottom=268 -->
  <!-- 3-line baselines 221/236/251: mid=236 ≈ wanted 235.85; 10px lines 15px apart -->
  <rect x="75" y="196" width="170" height="72" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="160" y="221" font-size="12" text-anchor="middle" fill="#166534">Python evaluator</text>
  <text x="160" y="236" font-size="10" text-anchor="middle" fill="#166534">resets state · grades DB</text>
  <text x="160" y="251" font-size="10" text-anchor="middle" fill="#166534">holds DB credentials</text>

  <rect x="275" y="196" width="170" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="360" y="221" font-size="12" text-anchor="middle" fill="#1e40af">Go agent</text>
  <text x="360" y="236" font-size="10" text-anchor="middle" fill="#1e40af">untrusted model loop</text>
  <text x="360" y="251" font-size="10" text-anchor="middle" fill="#1e40af">validates calls · no creds</text>

  <rect x="475" y="196" width="170" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="560" y="221" font-size="12" text-anchor="middle" fill="#b45309">Billing MCP (Go)</text>
  <text x="560" y="236" font-size="10" text-anchor="middle" fill="#b45309">tools/list · tools/call</text>
  <text x="560" y="251" font-size="10" text-anchor="middle" fill="#b45309">ACL on call · 127.0.0.1:18081</text>

  <!-- PostgreSQL: x=285 w=150 h=72 (3 lines), y=297 bottom=369, center=360 -->
  <!-- 3-line baselines 322/337/352: mid=337 ≈ wanted 336.85 -->
  <rect x="285" y="297" width="150" height="72" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="360" y="322" font-size="12" text-anchor="middle" fill="#9d174d">PostgreSQL</text>
  <text x="360" y="337" font-size="10" text-anchor="middle" fill="#9d174d">per-run isolated DB + seed</text>
  <text x="360" y="352" font-size="10" text-anchor="middle" fill="#9d174d">integer cents · idempotent</text>

  <!-- Ollama x=145 w=200 center=245 ; Artifacts x=375 w=200 center=475 ; y=437 h=54 (2 lines) bottom=491 -->
  <rect x="145" y="437" width="200" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="245" y="459" font-size="12" text-anchor="middle" fill="#1e40af">Native Ollama / Qwen</text>
  <text x="245" y="477" font-size="10" text-anchor="middle" fill="#1e40af">qwen3.5:9b · loopback 11434</text>

  <rect x="375" y="437" width="200" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="475" y="459" font-size="12" text-anchor="middle" fill="#166534">Artifacts (JSONL)</text>
  <text x="475" y="477" font-size="10" text-anchor="middle" fill="#166534">snapshots · verdicts · events</text>

  <!-- ===== LAYER 4: step-number labels (open canvas, clear of lines/walls/boxes) ===== -->
  <!-- 1: zone1/zone2 gap, in the pocket right of the launcher->evaluator curve -->
  <text x="335" y="163" font-size="11" text-anchor="middle" fill="#166534">1</text>
  <!-- 2: zone1/zone2 gap, right of the vertical launcher->agent line -->
  <text x="377" y="160" font-size="11" text-anchor="middle" fill="#1e40af">2</text>
  <!-- 4: gap between agent and MCP, above the 4a arrow -->
  <text x="460" y="218" font-size="11" text-anchor="middle" fill="#b45309">4</text>
  <!-- 6: left of the evaluator->PG vertical descent -->
  <text x="138" y="303" font-size="11" text-anchor="middle" fill="#166534">6</text>
  <!-- 3: zone2/zone3 gap, left of the agent->ollama descent -->
  <text x="222" y="400" font-size="11" text-anchor="middle" fill="#1e40af">3</text>
  <!-- 5: zone2/zone3 gap, right of the agent->artifacts descent -->
  <text x="498" y="400" font-size="11" text-anchor="middle" fill="#166534">5</text>

  <!-- ===== LEGEND + caption (outside the diagram body) ===== -->
  <text x="360" y="530" font-size="11" text-anchor="middle" fill="#64748b">Zones: control plane (purple) · Compose project (amber) · existing host, outside Compose (green)</text>
  <text x="360" y="550" font-size="10" text-anchor="middle" fill="#64748b">1 prepare + seed · 2 sanitized task · 3 model turn · 4 tools/call + atomic write · 5 JSONL events · 6 grade + reset</text>
  <text x="360" y="568" font-size="10" text-anchor="middle" fill="#94a3b8">Dashed arrows = model / reset traffic. Runtime path not yet proven (T019 in repair).</text>
</svg>
